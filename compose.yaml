services:
  saturn:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SATURN_PORT:-4176}:4176"
    environment:
      HOST: 0.0.0.0
      PORT: 4176
      SATURN_PUBLIC_URL: ${SATURN_PUBLIC_URL:-}
      SATURN_USER: ${SATURN_USER:-engineer}
      SATURN_PASSWORD: ${SATURN_PASSWORD:-}
      SATURN_PUSH_SUBJECT: ${SATURN_PUSH_SUBJECT:-}
    volumes:
      - saturn-data:/data
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4176/plant/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  saturn-data:
