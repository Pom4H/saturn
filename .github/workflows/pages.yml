name: Check and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # One locally reproducible product gate. Build once; the browser tests
      # consume dist/plant/site, which is also copied into the Pages artifact.
      - name: Saturn release check
        run: npm run check:release

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: shell-evidence
          path: test-results/release-shell/
          retention-days: 7
          if-no-files-found: ignore

      # HMI recording is evidence, not a dependency of unrelated source edits.
      - name: Capture PLC HMI video
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/hmi-video-evidence.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: hmi-evidence
          path: plant-test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run pages:build

      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: dist/pages

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - uses: actions/deploy-pages@v5.0.1
        id: deployment

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the published Saturn URL
        run: node scripts/verify-live.mjs
        env:
          SATURN_URL: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: live-pages-check
          path: live-check/
          retention-days: 7
          if-no-files-found: ignore
