name: README two-way binding

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saturn-readme-two-way-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: [self-hosted]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify ffmpeg
        run: ffmpeg -version
      - name: Capture real Saturn two-way binding
        run: node scripts/readme-two-way-binding.mjs
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/two-way-binding.gif
          git diff --cached --quiet || git commit -m "docs: refresh real Saturn two-way binding GIF"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: saturn-readme-two-way-binding
          path: |
            docs/assets/two-way-binding.gif
            test-results/readme-two-way-binding/frames/
          retention-days: 14
