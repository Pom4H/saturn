name: Validate sandbox implementation
on:
  push:
    branches: [feature/server-runs]
    paths: [.github/workflows/sandbox-bundle.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Apply checksummed implementation and prepare immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, lzma, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, payload=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
          chunks = ['8d1fddebe84543f5939e92b62ee27552f3ec1cd2','fc66dd312987077018f05710c2422e9d3f7c40d0','ea61cdd616186b96aafb5fe65f74ad01354c8e7a','a29aca39df047804428222a6c4c5119e00a0ae01','b8141b8d9bbc56251b009f4f39dd4de62bb2943c','2622a0277fa6e9ddb248987e0be3256d2d2dac27','25fafcca110262ddfa5ae035aa51d292bdd9a47e','2a53c3cd033e5c3858734be00b2cb22e86efc54b']
          packed = b''.join(base64.b64decode(api('/git/blobs/' + sha)['content']) for sha in chunks)
          assert hashlib.sha256(packed).hexdigest() == 'e3a548e78d4b6dfc32ee2aa1744a2663417e274f4c97aa2f2d1864ee8a303df9'
          patch = pathlib.Path('/tmp/scada-implementation.patch'); patch.write_bytes(lzma.decompress(packed))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          subprocess.run(['git','rm','.github/workflows/sandbox-bundle.yml'],check=True)
          parent = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base_tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          fields = subprocess.check_output(['git','diff','--cached','--name-status','--no-renames','-z']).decode().split('\0')[:-1]
          tree = []
          for status, path in zip(fields[::2],fields[1::2]):
              item={'path':path,'mode':'100644','type':'blob'}
              if status == 'D': item['sha']=None
              else: item['content']=pathlib.Path(path).read_text()
              tree.append(item)
          result_tree = api('/git/trees', {'base_tree':base_tree,'tree':tree})
          commit = api('/git/commits', {'message':'feat: isomorphic SCADA studio, offline PWA, causal DSL, reports and Web Push','tree':result_tree['sha'],'parents':[parent]})
          pathlib.Path('candidate.json').write_text(json.dumps({'sha':commit['sha'],'parent':parent,'files':len(tree)},indent=2))
          print('CANDIDATE_COMMIT=' + commit['sha'], flush=True)
          print('The branch is not advanced by this workflow. No merge or deployment is performed.', flush=True)
          PY
      - name: Install exact dependency tree
        run: npm ci
      - name: Native contracts, builds and strict TypeScript
        run: npm run check
      - name: Install real browsers
        run: npx playwright install --with-deps chromium webkit
      - name: PWA, browser SQL, local versions and authenticated server
        run: npm run test:studio:e2e
      - name: Existing editor and runtime browser regressions
        if: success() || failure()
        run: npm run test:e2e
      - name: Adversarial browser regressions
        if: success() || failure()
        run: npm run challenge:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: studio-validation
          path: |
            candidate.json
            studio-playwright-report/
            studio-test-results/
            playwright-report/
            test-results/
            runtime-playwright-report/
            runtime-test-results/
            challenge-results/
          retention-days: 7
