name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to package for a dry-run artifact build
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: npm ci
      - run: npm run plant:typecheck
      - run: npm run plant:build

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag v$VERSION does not match package.json $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack all standalone targets
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for TARGET in windows-x64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            EXT=""
            [[ "$TARGET" == windows-* ]] && EXT=".exe"
            FILE="saturn-$TARGET$EXT"
            npm run saturn -- pack \
              --target "$TARGET" \
              --version "$VERSION" \
              --outfile "dist/release/$FILE" \
              --skip-web-build
          done
          (
            cd dist/release
            sha256sum saturn-* | sort > SHA256SUMS.txt
            test "$(find . -maxdepth 1 -type f -name 'saturn-*' | wc -l)" -eq 5
            sha256sum -c SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: saturn-${{ steps.meta.outputs.version }}-standalone
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --verify-tag \
            --title "Saturn $GITHUB_REF_NAME" \
            --generate-notes
