name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to package for a dry-run artifact build
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows-x64
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: npm ci
      - run: npm run plant:typecheck
      - run: npm run plant:build

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag v$VERSION does not match package.json $PACKAGE_VERSION" >&2
            exit 1
          fi
          EXT=""
          [[ "$TARGET" == windows-* ]] && EXT=".exe"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "filename=saturn-$TARGET$EXT" >> "$GITHUB_OUTPUT"

      - name: Pack standalone
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.meta.outputs.version }}
          FILENAME: ${{ steps.meta.outputs.filename }}
        run: |
          mkdir -p dist/release
          npm run saturn -- pack --target "$TARGET" --version "$VERSION" --outfile "dist/release/$FILENAME" --skip-web-build
          (cd dist/release && sha256sum "$FILENAME" > "$FILENAME.sha256")

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Verify artifacts and collect checksums
        shell: bash
        run: |
          cd dist/release
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          cat *.sha256 | sort > SHA256SUMS.txt
          rm -- *.sha256
          test "$(find . -maxdepth 1 -type f -name 'saturn-*' | wc -l)" -eq 5

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --verify-tag \
            --title "Saturn $GITHUB_REF_NAME" \
            --generate-notes
