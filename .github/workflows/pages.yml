name: Apply checked shell candidate
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shell-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/shell-ux-issue-sweep'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact checked product bytes without changing workflows
        run: |
          cp .github/workflows/pages.yml /tmp/shell-apply-workflow.yml
          git show 9eea2d64508c6f09a61a87af333044cbace199d2:.github/workflows/pages.yml > .github/workflows/pages.yml
          python scripts/.shell-ux-apply.py
          cp /tmp/shell-apply-workflow.yml .github/workflows/pages.yml
          git rm scripts/.shell-ux-apply.py scripts/.shell-ux-final-ci.yml
          git diff --check
          git add package.json scripts/site-dev.mjs scripts/site-interaction-check.mjs scripts/site-release-check.mjs scripts/site-shell-ux-check.mjs scripts/site-studio-check.mjs site/index.html site/studio.css site/studio.ts site/styles.css src/view3d.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify shell themes and simplify equipment catalog' -m 'Usegit-Change-Id: shell-ux-issue-sweep-20260923
          Usegit-Experiment: EXP-shell-ux-regression
          Usegit-Intent: Fix theme mismatch nested scrolling clipped catalog controls and search focus
          Usegit-Hypothesis: Shared palette and one direct catalog operation preserve source while restoring usable layout
          Usegit-Granularity: Shell fixes their browser oracle and build-once release gate
          Usegit-Decision: pending full CI; local site check and real bundled browser UX journey passed'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/shell-ux-issue-sweep
