name: Visual DSL studio
on:
  push:
    branches: [feature/visual-dsl-shell]
permissions:
  contents: read
concurrency:
  group: visual-dsl-shell-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run plant:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: xvfb-run -a npm run plant:test:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: visual-dsl-shell-evidence
          path: plant-test-results/
          retention-days: 7
