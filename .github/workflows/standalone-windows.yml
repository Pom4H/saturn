name: Standalone Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feat/standalone-pack

permissions:
  contents: read

concurrency:
  group: standalone-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck plant runtime
        run: npm run plant:typecheck

      - name: Test plant runtime
        run: npm run plant:test

      - name: Build web assets
        run: npm run plant:build

      - name: Pack Windows executable
        run: npm run saturn -- pack --target windows-x64 --outfile dist/standalone/saturn.exe --skip-web-build

      - name: Smoke test executable
        run: node scripts/standalone-smoke.mjs dist/standalone/saturn.exe

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: saturn-windows-standalone
          path: |
            dist/standalone/saturn.exe
            standalone-test-results/
          retention-days: 14
