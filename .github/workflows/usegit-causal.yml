# usegit:managed
name: usegit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  causal-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate usegit repository state
        run: npx --yes github:Pom4H/usegit#main doctor
