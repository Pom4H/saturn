name: Sandbox source bundle
on:
  push:
    branches: [feature/isomorphic-pwa]
    paths: [.github/workflows/sandbox-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Prepare isolated Playwright browser
        run: |
          npx --yes playwright@1.63.0 install chromium-headless-shell
          tar -C "$HOME/.cache/ms-playwright" -czf /tmp/scada-browser.tar.gz .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sandbox-browser
          path: /tmp/scada-browser.tar.gz
          retention-days: 1
