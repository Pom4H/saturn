name: Import sandbox-verified SCADA implementation
on:
  push:
    branches: [feature/isomorphic-pwa]
    paths: [.github/workflows/apply-sandbox.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-isomorphic-pwa
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/feature/isomorphic-pwa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/isomorphic-pwa
      - name: Verify and extract exactly the sandbox-tested source
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.sandbox-transfer').glob('*.part'))
          assert [p.name for p in parts] == [f'{i:02}.part' for i in range(8)]
          payload = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(payload).hexdigest() == '653c3e7b3b3608ec99fa0739c9641bfd83d7fc36d9ef5332b9ea33866e913d45'
          files = json.loads(lzma.decompress(payload))['files']
          assert len(files) == 57
          fixed = {'.gitignore', 'CONTRIBUTING.md', 'README.md', 'package.json', 'package-lock.json', 'tsconfig.plant.json'}
          for name, item in files.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in fixed or name.startswith(('plant/', 'docs/plant/', 'scripts/plant-'))
              assert item['encoding'] in ('utf8', 'base64')
              data = base64.b64decode(item['content'], validate=True) if item['encoding'] == 'base64' else item['content'].encode('utf-8')
              destination = Path(name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              assert not destination.is_symlink()
              destination.write_bytes(data)
          print(f'Imported {len(files)} files; SHA-256 verified.')
          PY
      - name: Commit the verified implementation to its feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .sandbox-transfer
          git add .gitignore CONTRIBUTING.md README.md package.json package-lock.json tsconfig.plant.json plant docs/plant scripts/plant-*.mjs
          git diff --cached --check
          git commit -m 'feat: isomorphic Node and SQLite PWA with simulations, alarms, Git releases and report workflows'
          git push origin HEAD:feature/isomorphic-pwa
