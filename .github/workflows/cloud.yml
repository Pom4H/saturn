name: Saturn Cloud

on:
  pull_request:
    paths:
      - "cloud/**"
      - "plant/cloud-edge.ts"
      - "plant/http-server.ts"
      - "plant/bun-server.ts"
      - "plant/cli.ts"
      - "standalone/entry.ts"
      - ".github/workflows/cloud.yml"
  push:
    branches: [main, "release/**"]
    paths:
      - "cloud/**"
      - "plant/cloud-edge.ts"
      - "plant/http-server.ts"
      - "plant/bun-server.ts"
      - "plant/cli.ts"
      - "standalone/entry.ts"
      - ".github/workflows/cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run plant:typecheck
      - run: npm run architecture:check

  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
