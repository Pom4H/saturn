name: Saturn C23 target gate
# Compiles source emitted from the canonical TypeScript demo; no handwritten HMI fixture.

on:
  push:
    branches:
      - refactor/conventions-first
    paths:
      - 'plant/presentation-c23.ts'
      - 'plant/controller-c23.ts'
      - 'plant/saturn-shell-c23.ts'
      - 'plant/targets/saturn-plc-c23.ts'
      - 'plant/presentation-target.ts'
      - 'plant/controller.ts'
      - 'plant/dsl.ts'
      - 'plant/demo/**'
      - 'plant/tests/presentation.test.ts'
      - 'scripts/architecture-invariants.mjs'
      - 'scripts/saturn-c23-source.mjs'
      - '.github/workflows/issue-29-c23.yml'
  pull_request:
    branches:
      - release/v0.1.0-rc1
    paths:
      - 'plant/presentation-c23.ts'
      - 'plant/controller-c23.ts'
      - 'plant/saturn-shell-c23.ts'
      - 'plant/targets/saturn-plc-c23.ts'
      - 'plant/presentation-target.ts'
      - 'plant/controller.ts'
      - 'plant/dsl.ts'
      - 'plant/demo/**'
      - 'plant/tests/presentation.test.ts'
      - 'scripts/architecture-invariants.mjs'
      - 'scripts/saturn-c23-source.mjs'
      - '.github/workflows/issue-29-c23.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturn-c23-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-sdk:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate C23 target from canonical demo project
        run: |
          node scripts/saturn-c23-source.mjs issue29-generated SATURN-1
          Get-ChildItem issue29-generated -File | Sort-Object Name | Format-Table Name,Length -AutoSize
          Get-Content issue29-generated\manifest.json

      - name: Inspect official Saturn C23 installers
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force issue29-evidence | Out-Null
          $gccInstaller = Join-Path $env:RUNNER_TEMP 'risc-v-gcc13.2.0.exe'
          $sdkInstaller = Join-Path $env:RUNNER_TEMP 'sat-sdk-setup.exe'
          curl.exe -fL --retry 3 https://www.mnppsaturn.ru/update/satsdk/risc-v-gcc13.2.0.exe -o $gccInstaller
          curl.exe -fL --retry 3 https://www.mnppsaturn.ru/update/satsdk/sat-sdk-setup.exe -o $sdkInstaller
          Get-FileHash $gccInstaller,$sdkInstaller -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 500 | Tee-Object -FilePath issue29-evidence\installer-sha256.txt
          Get-Item $gccInstaller,$sdkInstaller | Select-Object FullName,Length,@{N='ProductName';E={$_.VersionInfo.ProductName}},@{N='FileDescription';E={$_.VersionInfo.FileDescription}},@{N='CompanyName';E={$_.VersionInfo.CompanyName}},@{N='FileVersion';E={$_.VersionInfo.FileVersion}} | Format-Table -AutoSize | Out-String -Width 500 | Tee-Object -FilePath issue29-evidence\installer-version-info.txt
          $seven = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $seven -and (Test-Path 'C:\Program Files\7-Zip\7z.exe')) { $seven = 'C:\Program Files\7-Zip\7z.exe' }
          if ($seven) {
            "7Z=$seven" | Out-File issue29-evidence\extractor.txt -Encoding utf8
            & $seven l -slt $gccInstaller | Out-File issue29-evidence\gcc-archive.txt -Encoding utf8
            & $seven l -slt $sdkInstaller | Out-File issue29-evidence\sdk-archive.txt -Encoding utf8
            Get-Content issue29-evidence\gcc-archive.txt | Select-Object -First 180
            Get-Content issue29-evidence\sdk-archive.txt | Select-Object -First 180
          } else {
            '7-Zip not found' | Tee-Object -FilePath issue29-evidence\extractor.txt
          }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($gccInstaller))
          [regex]::Matches($ascii, '[ -~]{8,}') | ForEach-Object Value | Where-Object { $_ -match 'Inno|NSIS|Nullsoft|7-Zip|SFX|silent|install|gcc|riscv' } | Select-Object -Unique -First 100 | Out-File issue29-evidence\gcc-strings.txt -Encoding utf8
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($sdkInstaller))
          [regex]::Matches($ascii, '[ -~]{8,}') | ForEach-Object Value | Where-Object { $_ -match 'Inno|NSIS|Nullsoft|7-Zip|SFX|silent|install|sat|sdk' } | Select-Object -Unique -First 100 | Out-File issue29-evidence\sdk-strings.txt -Encoding utf8
          Get-Content issue29-evidence\installer-version-info.txt
          Get-Content issue29-evidence\extractor.txt

      - name: Inventory exact SDK build surface
        if: ${{ env.SDK_DIR != '' && env.GCC_DIR != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = Get-ChildItem $env:GCC_DIR -File -Recurse -Filter '*gcc*.exe' | Sort-Object FullName
          $headers = Get-ChildItem $env:SDK_DIR -File -Recurse | Where-Object { $_.Name -match '^(satgui|satmio|satkbd|satplc|satscr).*\.h$' } | Sort-Object FullName
          $build = Get-ChildItem $env:SDK_DIR -File -Recurse | Where-Object { $_.Name -match '^(Makefile|tasks\.json|c_cpp_properties\.json|.*\.bat|.*\.cmd)$' } | Sort-Object FullName
          $libs = Get-ChildItem $env:SDK_DIR -File -Recurse | Where-Object { $_.Extension -in '.a','.ld' } | Sort-Object FullName
          $gcc | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 500 | Tee-Object -FilePath issue29-evidence\gcc-paths.txt
          $headers | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 500 | Tee-Object -FilePath issue29-evidence\headers.txt
          $build | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 500 | Tee-Object -FilePath issue29-evidence\build-files.txt
          $libs | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 500 | Tee-Object -FilePath issue29-evidence\libraries.txt
          foreach ($file in $headers) {
            "===== $($file.FullName) =====" | Out-File issue29-evidence\sdk-surface.txt -Encoding utf8 -Append
            Get-Content $file.FullName | Select-Object -First 260 | Out-File issue29-evidence\sdk-surface.txt -Encoding utf8 -Append
          }
          foreach ($file in ($build | Select-Object -First 40)) {
            "===== $($file.FullName) =====" | Out-File issue29-evidence\build-surface.txt -Encoding utf8 -Append
            Get-Content $file.FullName -ErrorAction SilentlyContinue | Select-Object -First 260 | Out-File issue29-evidence\build-surface.txt -Encoding utf8 -Append
          }
          Get-Content issue29-evidence\gcc-paths.txt
          Get-Content issue29-evidence\headers.txt
          Get-Content issue29-evidence\build-files.txt
          Get-Content issue29-evidence\libraries.txt

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: saturn-c23-sdk-evidence
          path: |
            issue29-evidence/
            issue29-generated/
          retention-days: 7
