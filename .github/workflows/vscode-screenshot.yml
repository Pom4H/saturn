name: VS Code installed screenshot

on:
  pull_request:
    paths:
      - 'vscode/**'
      - 'standalone/**'
      - 'plant/**'
      - 'scripts/standalone-pack.ts'
      - '.github/workflows/vscode-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: npm ci

      - name: Build Saturn CLI
        run: |
          npm run plant:build
          node scripts/update-test-key.mjs "${{ runner.temp }}\saturn-vscode-key"
          npm run saturn -- pack --target windows-x64 --outfile "${{ runner.temp }}\saturn.exe" --skip-web-build --update-public-key-file "${{ runner.temp }}\saturn-vscode-key\public.pem"

      - name: Prepare clean VS Code with Saturn installed
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ runner.temp }}\saturn-vscode"
          $codeZip = Join-Path $root 'vscode.zip'
          $codeRoot = Join-Path $root 'code'
          $userData = Join-Path $root 'user-data'
          $extensions = Join-Path $root 'extensions'
          $extensionTarget = Join-Path $extensions 'saturn.saturn-vscode-0.1.0'
          New-Item -ItemType Directory -Force -Path $root,$codeRoot,$userData,$extensions,$extensionTarget | Out-Null

          Invoke-WebRequest 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable' -OutFile $codeZip
          Expand-Archive -Path $codeZip -DestinationPath $codeRoot -Force
          Copy-Item -Recurse -Force 'vscode\*' $extensionTarget

          $settingsDir = Join-Path $userData 'User'
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          $saturnExe = "${{ runner.temp }}\saturn.exe".Replace('\','\\')
          @"
          {
            "security.workspace.trust.enabled": false,
            "workbench.startupEditor": "none",
            "workbench.colorTheme": "Default Dark Modern",
            "workbench.activityBar.location": "default",
            "workbench.sideBar.location": "left",
            "window.restoreWindows": "none",
            "window.commandCenter": false,
            "saturn.cli.path": "$saturnExe",
            "saturn.project.entry": "plant.ts"
          }
          "@ | Set-Content -Encoding UTF8 (Join-Path $settingsDir 'settings.json')

          @"
          [
            { "key": "ctrl+alt+s", "command": "workbench.view.extension.saturn" },
            { "key": "ctrl+alt+d", "command": "saturn.openDiagram" }
          ]
          "@ | Set-Content -Encoding UTF8 (Join-Path $settingsDir 'keybindings.json')

          "CODE_ROOT=$codeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CODE_USER=$userData" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CODE_EXTENSIONS=$extensions" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch VS Code and capture real window
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindow {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdcBlt, uint nFlags);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          "@

          $workspace = (Resolve-Path 'plant\demo').Path
          $file = (Resolve-Path 'plant\demo\plant.ts').Path
          $code = Join-Path $env:CODE_ROOT 'Code.exe'
          $args = @(
            '--user-data-dir', $env:CODE_USER,
            '--extensions-dir', $env:CODE_EXTENSIONS,
            '--disable-updates',
            '--disable-workspace-trust',
            '--new-window',
            $workspace,
            $file
          )
          Start-Process -FilePath $code -ArgumentList $args | Out-Null

          $proc = $null
          for ($i=0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            $proc = Get-Process Code -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Sort-Object StartTime -Descending | Select-Object -First 1
            if ($proc) { break }
          }
          if (-not $proc) { throw 'VS Code did not create a visible window on the runner.' }

          [NativeWindow]::ShowWindow($proc.MainWindowHandle, 3) | Out-Null
          [NativeWindow]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 3
          [System.Windows.Forms.SendKeys]::SendWait('^%s')
          Start-Sleep -Seconds 2
          [System.Windows.Forms.SendKeys]::SendWait('^%d')
          Start-Sleep -Seconds 6

          $rect = New-Object NativeWindow+RECT
          if (-not [NativeWindow]::GetWindowRect($proc.MainWindowHandle, [ref]$rect)) { throw 'GetWindowRect failed.' }
          $width = [Math]::Max(1, $rect.Right - $rect.Left)
          $height = [Math]::Max(1, $rect.Bottom - $rect.Top)
          $bitmap = New-Object System.Drawing.Bitmap $width, $height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $hdc = $graphics.GetHdc()
          $printed = [NativeWindow]::PrintWindow($proc.MainWindowHandle, $hdc, 2)
          $graphics.ReleaseHdc($hdc)
          $graphics.Dispose()

          if (-not $printed) {
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, (New-Object System.Drawing.Size $width,$height))
            $graphics.Dispose()
          }

          New-Item -ItemType Directory -Force -Path 'vscode-screenshot' | Out-Null
          $out = (Resolve-Path 'vscode-screenshot').Path + '\saturn-vscode-installed.png'
          $bitmap.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()

          $list = & $code --user-data-dir $env:CODE_USER --extensions-dir $env:CODE_EXTENSIONS --list-extensions --show-versions
          $list | Set-Content -Encoding UTF8 'vscode-screenshot\installed-extensions.txt'
          if ($list -notmatch 'saturn\.saturn-vscode@0\.1\.0') { throw "Saturn extension is not listed as installed: $list" }

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: saturn-vscode-installed
          path: vscode-screenshot/
          retention-days: 7
