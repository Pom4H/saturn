name: Saturn product tour
on:
  workflow_dispatch:
  push:
    branches:
      - feat/self-hosted-product-tour
permissions:
  contents: read
jobs:
  tour:
    runs-on: [self-hosted]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run plant:build
      - run: npx playwright install chromium
      - run: node scripts/product-tour.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: saturn-product-tour
          path: product-tour/
          retention-days: 14
