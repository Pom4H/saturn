name: Sandbox source bundle
on:
  push:
    branches: [feature/isomorphic-pwa]
    paths: [.github/workflows/sandbox-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Prepare portable source and dependencies
        run: |
          npm install --save-exact @sqlite.org/sqlite-wasm@3.53.4-build1 web-push@3.6.7
          npm install --save-dev --save-exact @types/web-push@3.6.4
          tar --exclude=.git --exclude=node_modules -czf /tmp/scada-source.tar.gz .
          tar -czf /tmp/scada-vendor.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sandbox-source
          path: |
            /tmp/scada-source.tar.gz
            /tmp/scada-vendor.tar.gz
          retention-days: 1
