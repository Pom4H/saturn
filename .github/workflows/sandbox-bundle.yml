name: Sandbox browser bundle
on:
  push:
    branches: [feature/server-runs]
    paths: [.github/workflows/sandbox-bundle.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare Firefox for the network-isolated sandbox
        run: |
          npm ci
          npx playwright install firefox
          tar -czf sandbox-browser.tar.gz -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-browser
          path: sandbox-browser.tar.gz
          retention-days: 2
